<!-- templates/blog/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Желтушная пресса{% endblock %}</title>

    <!-- Подключаем Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Минимальные стили для "жёлтой прессы" -->
    <style>
        body {
            background-color: #fffacd; /* Жёлто-бежевый — как старая газета */
            color: #000; /* Чёрный текст */
            font-family: 'Times New Roman', serif;
        }

        .navbar-brand {
            font-weight: 900;
            color: #000 !important;
        }

        .post-card {
            border: 3px solid black;
            border-radius: 0; /* Прямые углы — как в газете */
            background: white;
            box-shadow: 5px 5px 0 #ffdd00;
        }

        .btn-warning {
            border: 2px solid black;
            font-weight: bold;
        }

        footer {
            border-top: 3px solid #ffdd00;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- Навигация — жёлтая с чёрной рамкой -->
    <nav class="navbar navbar-expand-lg bg-warning border-bottom border-dark">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="{% url 'blog:list' %}">
                📰 ЖЕЛТУШНАЯ ПРЕССА
            </a>
            <div class="d-flex gap-2">
                <a href="{% url 'blog:list' %}" class="btn btn-warning text-dark border-dark">ВСЕ ПОСТЫ</a>
                <a href="{% url 'blog:create' %}" class="btn btn-warning text-dark border-dark">НОВЫЙ ПОСТ</a>
            </div>
        </div>
    </nav>

    <!-- Контент -->
    <div class="container my-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Футер -->
    <footer class="text-center py-4 bg-warning text-dark fw-bold">
        &copy; 2025 — СЕНСАЦИИ КАЖДЫЙ ДЕНЬ
    </footer>

</body>
</html>
