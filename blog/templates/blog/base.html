<!-- templates/blog/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Блог{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'blog:list' %}">Мой Блог</a>
            <div class="ms-auto">
                <a href="{% url 'blog:list' %}" class="btn btn-outline-light btn-sm">Все посты</a>
                <a href="{% url 'blog:create' %}" class="btn btn-success btn-sm">Новый пост</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 text-muted">
        &copy; 2025 — Мой Блог
    </footer>
</body>
</html>
